[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
ethers = "2.0.14"
eyre = "0.6.12"
tokio = { version = "1.45.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "0.14", features = ["full"] }
hyper-tls = "0.5.0"
http-body-util = "0.1"
mime = "0.3"
http = "1.3.1"
headers = "0.4.1"
reqwest = { version = "0.11", features = ["multipart", "stream"] }
chrono = "0.4.41"
futures = "0.3.31"
